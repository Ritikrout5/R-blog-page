<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/utils.css">
    <link rel="stylesheet" href="css/contact.css">
    <link rel="stylesheet" href="css/mobile.css">

    <title>RBlog-Everything for Blogger</title>
</head>

<body>
    <div class="navigation ">
        <div class="nav-left">
            <span><img src="images/logo.png" alt="Logo" width="74px"></span>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/">About</a></li>
                <li><a href="/contact.html">Contact</a></li>

            </ul>
        </div>
        <div class="nav-right">
            <form action="/search.html" method="get">
                <input class="form-input" type="text" name="query" placeholder="Blog Search">
                <button class="btn">Search</button>
            </form>

        </div>

    </div>
    <div class="max-width-1 m-auto">
        <hr>
    </div>
    <div class="contact-content max-width-1 m-auto">
        <div class="max-width-1 m-auto ">
            <h2>Feel Free To Contact Us...</h2>
            <div class="contact-form">
                <div class="form-box">
                    <input type="text" placeholder="Enter your name">
                </div>

                <div class="form-box">
                    <input type="text" placeholder="Enter your E-mail id">
                </div>
                <div class="form-box">
                    <input type="text" placeholder="Enter your Phone Number">
                </div>
                <div class="form-box">
                    <textarea name="" id="" cols="30" rows="10" placeholder="How may I help you ?"></textarea>
                </div>
                <div class="form-box">
                   <button class="btn">Submit</button>
                </div>
            </div>
        </div>
        
    </div>

    <div class="footer ">
        <p>Designed & Developed by <strong>Ritikranjan Rout</strong></p>
        <p>&copy; 2025 R-BLOG. All Rights Reserved.</p>

    </div>


</body>

</html>
